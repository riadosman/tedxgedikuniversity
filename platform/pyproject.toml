[project]
name = "tedx-event-operations"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "Django>=5.2,<5.3", "psycopg[binary]>=3.2,<4", "django-otp>=1.6,<2",
  "cryptography>=45", "qrcode[pil]>=8,<9", "Pillow>=11", "whitenoise>=6.9,<7",
  "argon2-cffi>=25", "python-dotenv>=1.1,<2", "gunicorn>=23; sys_platform != 'win32'",
  "waitress>=3.0,<4; sys_platform == 'win32'",
]
[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-django>=4.11",
    "pytest-cov>=6",
    "ruff>=0.12",
    "playwright>=1.55",
    "mypy>=2.3.1",
    "django-stubs>=5.2,<5.3",
    "types-qrcode>=8.2.0.20260518",
    "types-pillow>=10.2.0.20240822",
    "polib>=1.2.0",
    "types-polib>=1.2.0.20260518",
]
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
[tool.ruff]
line-length = 110
target-version = "py311"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
plugins = ["mypy_django_plugin.main"]
files = ["core", "admissions", "team", "program", "operations", "communications", "documents", "payments", "config"]
exclude = ["migrations/"]
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true

[tool.django-stubs]
django_settings_module = "config.settings"

[[tool.mypy.overrides]]
module = ["django_otp.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["admissions.contracts", "payments.providers", "core.permissions", "core.logging", "core.services", "admissions.services"]
disallow_untyped_defs = true
disallow_untyped_calls = true
warn_return_any = true
disallow_any_generics = true
