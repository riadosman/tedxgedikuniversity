{% load i18n %}
<aside class="event-card event-card-compact" aria-label="{% translate 'Your event' %}"><p class="kicker">{% translate 'Your event' %}</p><p class="event-card-date">{{ event.starts_at|date:'j F Y' }}</p><p class="event-card-day"><bdi dir="ltr">{{ event.starts_at|date:'H:i' }}–{{ event.ends_at|date:'H:i' }}</bdi> · {{ event.timezone }}</p><a class="button" href="{% url 'register' event.slug %}">{% translate 'Register' %} <span class="directional" aria-hidden="true">→</span></a><div class="event-card-links"><a href="{% url 'recover' event.slug %}">{% translate 'Find my ticket' %}</a><a href="{% url 'public-page' event.slug 'venue' %}">{% translate 'Venue' %}</a><a href="{% url 'public-page' event.slug 'contact' %}">{% translate 'Contact the team' %}</a></div></aside>
