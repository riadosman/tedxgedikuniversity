{% load i18n %}
<aside class="visitor-help"><p class="eyebrow">{% translate 'Your event' %}</p><h2>{{ event.name }}</h2><p>{{ event.starts_at|date:'d F Y' }}<br><bdi dir="ltr">{{ event.starts_at|date:'H:i' }}–{{ event.ends_at|date:'H:i' }}</bdi></p><a class="button" href="{% url 'register' event.slug %}">{% translate 'Register' %}<span class="directional" aria-hidden="true">→</span></a><a href="{% url 'recover' event.slug %}">{% translate 'Find my ticket' %}</a><div class="visitor-help-links"><a href="{% url 'public-page' event.slug 'venue' %}">{% translate 'Venue' %}</a><a href="{% url 'public-page' event.slug 'contact' %}">{% translate 'Contact the team' %}</a></div></aside>
