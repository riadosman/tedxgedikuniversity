{% load i18n %}
<details class="language-menu">
  <summary aria-label="{% translate 'Interface language' %}"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18"/></svg><span class="language-current">{% if LANGUAGE_CODE == 'tr' %}Türkçe{% elif LANGUAGE_CODE == 'ar' %}العربية{% else %}English{% endif %}</span><span class="language-code">{{ LANGUAGE_CODE|upper }}</span><span class="language-chevron" aria-hidden="true">⌄</span></summary>
  <form class="language-switch" method="post" action="{% url 'set_language' %}">{% csrf_token %}<input type="hidden" name="next" value="{{ language_next }}"><p class="language-label">{% translate 'Interface language' %}</p>{% for code,name in interface_languages %}<button type="submit" name="language" value="{{ code }}" lang="{{ code }}" dir="{% if code == 'ar' %}rtl{% else %}ltr{% endif %}" {% if code == LANGUAGE_CODE %}aria-current="true"{% endif %}><span>{{ name }}</span><span aria-hidden="true">{% if code == LANGUAGE_CODE %}✓{% endif %}</span></button>{% endfor %}</form>
</details>
