{% extends 'public/base.html' %}{% load i18n %}{% block content %}<section class="section narrow"><h1>{% translate "Your volunteer application" %}</h1><h2>{{ application.name }}</h2><p>{% translate "Status:" %} {{ application.get_status_display }}</p>{% if application.status != 'withdrawn' %}<form method="post" data-confirm="{% translate 'Withdraw your application and cancel active volunteer assignments?' %}">{% csrf_token %}<button class="secondary">{% translate "Withdraw application" %}</button></form>{% endif %}</section>{% endblock %}
